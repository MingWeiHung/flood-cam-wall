<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>仁武・八德 防汛影像牆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0B1620;
    --panel:#142430;
    --line:#24404F;
    --ink:#DCE8EE;
    --muted:#7E97A5;
    --signal:#56C8D8;
    --alert:#E8913A;
    --ok:#5FBF8E;
    --display:"Barlow Condensed","Noto Sans TC",sans-serif;
    --body:"Noto Sans TC",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--deep);color:var(--ink);font-family:var(--body);min-height:100vh;
    background-image:linear-gradient(180deg,#0E1E2B 0%,var(--deep) 420px);
    padding-top:12px;transition:padding-top .26s ease;
  }
  body.bar-open{padding-top:var(--barh,96px)}

  /* ---------- 頁首 ---------- */
  .bar{
    display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between;
    padding:22px 24px 14px;border-bottom:1px solid var(--line);
    position:fixed;top:0;left:0;right:0;z-index:30;
    background:#0E1E2B;transition:transform .26s ease;
  }
  .bar.collapsed{transform:translateY(calc(-100% + 6px))}
  .bar::after{
    content:"";position:absolute;left:50%;bottom:2px;width:46px;height:2px;
    transform:translateX(-50%);background:var(--line);opacity:0;transition:opacity .2s;
  }
  .bar.collapsed::after{opacity:1}
  .hotzone{position:fixed;top:0;left:0;right:0;height:26px;z-index:29}

  .brand{display:flex;align-items:center;gap:14px}
  .mark{
    width:42px;height:42px;flex:none;display:grid;place-items:center;
    border:1px solid var(--signal);color:var(--signal);
    font-family:var(--display);font-size:24px;font-weight:700;line-height:1;
  }
  .brand h1{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.06em;margin:0;line-height:1.05}
  .brand p{margin:3px 0 0;font-size:12px;color:var(--muted);letter-spacing:.12em}

  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
  .clock{
    font-family:var(--mono);font-size:22px;letter-spacing:.04em;color:var(--signal);
    padding-right:12px;border-right:1px solid var(--line);margin-right:2px;
  }
  .ctl{
    appearance:none;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:0;
    font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.08em;
    padding:8px 14px;cursor:pointer;transition:border-color .15s,color .15s;
  }
  .ctl:hover{border-color:var(--signal);color:var(--signal)}
  .ctl:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .ctl.primary{border-color:var(--signal);color:var(--signal)}
  select.ctl option{background:var(--panel);color:var(--ink)}
  .ctl[data-paused="true"]{border-color:var(--alert);color:var(--alert)}
  .progress{position:absolute;left:0;bottom:-1px;height:2px;background:var(--signal);width:0;opacity:.7}

  /* ---------- 站點選單 ---------- */
  .picker-wrap{position:relative}
  .picker{
    display:none;position:absolute;right:0;top:calc(100% + 10px);width:min(460px,92vw);
    background:#10202C;border:1px solid var(--line);z-index:40;
    max-height:70vh;overflow:auto;box-shadow:0 18px 40px rgba(0,0,0,.5);
  }
  .picker.open{display:block}
  .picker h3{
    margin:0;padding:13px 16px 11px;font-family:var(--display);font-size:16px;letter-spacing:.1em;
    border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  }
  .picker h3 .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:0}
  .picker-acts{display:flex;gap:8px;padding:11px 16px;border-bottom:1px solid var(--line)}
  .picker-acts .ctl{font-size:13px;padding:5px 10px}
  .opt{
    display:flex;align-items:center;gap:11px;padding:9px 16px;cursor:pointer;
    border-bottom:1px solid rgba(36,64,79,.5);
  }
  .opt:hover{background:rgba(86,200,216,.07)}
  .opt input{accent-color:var(--signal);width:15px;height:15px;flex:none;cursor:pointer}
  .opt .nm{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .opt .kind{font-family:var(--display);font-size:11px;letter-spacing:.1em;color:var(--muted);border:1px solid var(--line);padding:1px 6px;flex:none}
  .opt .kind.jwt{color:var(--alert);border-color:var(--alert)}
  .opt .del{
    background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;flex:none;
  }
  .opt .del:hover{color:var(--alert)}
  .import{padding:13px 16px 16px;border-top:1px solid var(--line)}
  .import label{display:block;font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:8px}
  .import textarea{
    width:100%;height:88px;background:#0B1620;color:var(--ink);border:1px solid var(--line);
    font-family:var(--mono);font-size:11px;padding:9px;resize:vertical;
  }
  .import textarea:focus-visible{outline:1px solid var(--signal)}
  .import .row{display:flex;gap:8px;align-items:center;margin-top:9px}
  .import .msg{font-size:12px;color:var(--signal)}

  /* ---------- 影像牆 ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px;padding:20px 24px 8px}
  .empty{padding:70px 24px;text-align:center;color:var(--muted);font-size:14px;line-height:2}
  .panel{display:flex;background:var(--panel);border:1px solid var(--line)}
  .rule{
    width:34px;flex:none;position:relative;border-right:1px solid var(--line);
    background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 14px);
    background-position:right 0 top 0;background-size:9px 100%;background-repeat:repeat-y;
  }
  .rule::before{content:"";position:absolute;right:0;top:0;bottom:0;width:16px;background:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 70px)}
  .idx{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-family:var(--display);font-size:17px;font-weight:700;color:var(--signal)}
  .rule .unit{
    position:absolute;left:50%;bottom:12px;transform:translateX(-50%) rotate(180deg);
    writing-mode:vertical-rl;font-family:var(--display);font-size:11px;letter-spacing:.22em;color:var(--muted);
  }
  .pbody{flex:1;min-width:0;display:flex;flex-direction:column}
  .phead{display:flex;align-items:center;gap:9px;padding:11px 14px 9px;border-bottom:1px solid var(--line)}
  .phead h2{margin:0;font-size:16px;font-weight:700;letter-spacing:.02em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grip{flex:none;color:var(--muted);font-size:14px;line-height:1;cursor:grab;letter-spacing:-2px}
  .panel:active .grip{cursor:grabbing}
  .move{flex:none;display:flex;gap:2px;margin-left:2px}
  .move button{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    width:22px;height:22px;line-height:1;font-size:15px;cursor:pointer;padding:0;
  }
  .move button:hover{border-color:var(--signal);color:var(--signal)}
  .panel.dragging{opacity:.35}
  .panel.over{outline:2px dashed var(--signal);outline-offset:-2px}
  .tag{margin-left:auto;flex:none;font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--muted);border:1px solid var(--line);padding:2px 7px}
  .frame{position:relative;aspect-ratio:16/9;background:#08111A;overflow:hidden;cursor:zoom-in}
  .frame img{width:100%;height:100%;object-fit:contain;display:block}
  .frame img[hidden]{display:none}
  .frame::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--signal),transparent);opacity:0}
  .frame.loading::after{animation:sweep 1s linear infinite}
  @keyframes sweep{0%{opacity:.9;transform:translateY(0)}100%{opacity:.9;transform:translateY(calc(100% * 100))}}
  .state{position:absolute;inset:0;display:none;place-content:center;text-align:center;padding:18px;font-size:13px;color:var(--muted)}
  .frame.failed .state{display:grid}
  .state strong{display:block;font-size:15px;color:var(--alert);margin-bottom:6px}
  .pfoot{display:flex;align-items:center;gap:9px;padding:9px 14px;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--muted)}
  .dot{width:7px;height:7px;flex:none;background:var(--muted);border-radius:50%}
  .panel.live .dot{background:var(--ok)}
  .panel.failed .dot{background:var(--alert)}
  .pfoot .exp{margin-left:auto;text-align:right}
  .pfoot .exp.soon{color:var(--alert)}

  /* ---------- 放大 ---------- */
  .viewer{position:fixed;inset:0;background:rgba(6,14,20,.94);display:none;flex-direction:column;z-index:50;padding:18px}
  .viewer.open{display:flex}
  .viewer-top{display:flex;align-items:center;gap:14px;padding-bottom:12px}
  .viewer-top h3{margin:0;font-size:18px;font-weight:700}
  .viewer img{flex:1;min-height:0;width:100%;object-fit:contain}
  .viewer .ctl{margin-left:auto}

  .note{padding:6px 24px 28px;font-size:12px;line-height:1.9;color:var(--muted);max-width:820px}
  .note code{font-family:var(--mono);color:var(--signal);font-size:11px}

  @media (max-width:820px){
    .grid{grid-template-columns:minmax(0,1fr);padding:16px}
    .bar{padding:18px 16px 12px}
    .brand h1{font-size:24px}
    .clock{font-size:18px}
    .note{padding:6px 16px 24px}
  }
  @media (prefers-reduced-motion:reduce){
    .frame.loading::after{animation:none;opacity:.5}
    *{transition:none!important}
  }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <div class="mark" aria-hidden="true">水</div>
    <div>
      <h1>仁武・八德 防汛影像牆</h1>
      <p>高雄市水利局 淹水資訊 · 自選站點監看</p>
    </div>
  </div>
  <div class="controls">
    <div class="clock" id="clock">--:--:--</div>
    <div class="picker-wrap">
      <button class="ctl primary" id="picker-btn">選擇站點 <span id="picker-n">0/0</span></button>
      <div class="picker" id="picker">
        <h3>站點清單 <span class="count" id="picker-count"></span></h3>
        <div class="picker-acts">
          <button class="ctl" data-act="all">全選</button>
          <button class="ctl" data-act="none">清除</button>
          <button class="ctl" data-act="notoken">只留免憑證</button>
        </div>
        <div id="opts"></div>
        <div class="import">
          <label>
            <b style="color:var(--ink)">憑證過期時</b>：把新複製的網址貼進來，同一支攝影機會直接換掉網址，名稱和位置都保留。<br>
            <b style="color:var(--ink)">新增站點</b>：一行名稱、一行網址，可連續貼多組。
          </label>
          <textarea id="import-box" placeholder="鳳仁路與澄觀路口&#10;https://floodinfo.kcg.gov.tw/public/SensorImage/xxxx.jpg"></textarea>
          <div class="row">
            <button class="ctl" id="import-btn">加入清單</button>
            <span class="msg" id="import-msg"></span>
          </div>
        </div>
      </div>
    </div>
    <select class="ctl" id="interval" aria-label="更新間隔">
      <option value="15">每 15 秒</option>
      <option value="30" selected>每 30 秒</option>
      <option value="60">每 60 秒</option>
      <option value="300">每 5 分鐘</option>
    </select>
    <button class="ctl" id="pause" data-paused="false">暫停更新</button>
    <button class="ctl" id="reload">立即重載</button>
  </div>
  <div class="progress" id="progress"></div>
</header>
<div class="hotzone" id="hotzone" title="滑鼠移到頂端顯示控制列"></div>

<main class="grid" id="grid"></main>
<div class="empty" id="empty" hidden>尚未選擇站點<br>點右上角「選擇站點」勾選要監看的路口</div>

<p class="note">
  影像由高雄市政府淹水資訊平台與 <a href="https://www.twipcam.com/" target="_blank" rel="noopener" style="color:var(--signal)">twipcam</a>（CC BY 3.0 TW）提供，本頁只負責排版與定時重載，不儲存任何畫面。<br>
  標示 <code>CCTV</code> 的網址帶有 <code>jwt</code> 憑證，約兩天到期，需回原平台重新複製網址；標示 <code>道路</code> <code>感測</code> <code>水利署</code> 的免憑證，長期有效，預設只勾選這些。<br>
  你的勾選與自行新增的站點會存在這台裝置的瀏覽器裡，換裝置要重新設定。
</p>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="放大檢視">
  <div class="viewer-top">
    <h3 id="viewer-name">—</h3>
    <button class="ctl" id="viewer-close">關閉</button>
  </div>
  <img id="viewer-img" alt="">
</div>

<script>
/* ====== 內建站點目錄 ====== */
const BUILTIN = [
  { name:"八德東路橋（八涳橋）", url:"https://floodinfo.kcg.gov.tw//service/api/cctv/wrs/image/1511?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3ODgyNDU0MjYsIm5iZiI6MTc4ODI0NTQyNiwianRpIjoiNjE0YzBmYWUtODA5Ny00ODAyLWJhN2MtYWY3YWEwZmUyN2NlIiwiZXhwIjoxNzg4NDE4MjI2LCJpZGVudGl0eSI6ImthbyIsImZyZXNoIjpmYWxzZSwidHlwZSI6ImFjY2VzcyJ9.Qd_KdhjS760FQFNCIy7DOSOpdsSkzcQFpIf_AMUsbEE&guid=16b8b747-0afc-406d-86ac-7d582d01e723" },
  { name:"八德東路388巷與名湖街口", url:"https://floodinfo.kcg.gov.tw/public/SensorImage/3972500FL0006.jpg?guid=31ef2b11-c495-4ce9-ad62-269840561a7d" },
  { name:"北屋北街與京文路口", url:"https://floodinfo.kcg.gov.tw//service/api/cctv/wrs/image/1512?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3ODgyNDU0MjYsIm5iZiI6MTc4ODI0NTQyNiwianRpIjoiNjE0YzBmYWUtODA5Ny00ODAyLWJhN2MtYWY3YWEwZmUyN2NlIiwiZXhwIjoxNzg4NDE4MjI2LCJpZGVudGl0eSI6ImthbyIsImZyZXNoIjpmYWxzZSwidHlwZSI6ImFjY2VzcyJ9.Qd_KdhjS760FQFNCIy7DOSOpdsSkzcQFpIf_AMUsbEE&guid=ae4baf84-b461-47fb-8a68-2adce2efd645" },
  { name:"仁光路與仁雄路口（NET）", url:"https://floodinfo.kcg.gov.tw/public/SensorImage/3972500FL0008.jpg?guid=64bfdc17-dbf7-4fb1-a0cc-1d185cece941" },
  { name:"澄觀路與仁怡街口", url:"https://floodinfo.kcg.gov.tw/public/SensorImage/TSIOT029.jpg?guid=8dc281e3-eda5-46e2-80f8-0f2bf969ac3d" },
  { name:"澄觀橋", url:"https://floodinfo.kcg.gov.tw//service/api/cctv/wrs/image/351?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE3ODgyNDU0MjYsIm5iZiI6MTc4ODI0NTQyNiwianRpIjoiNjE0YzBmYWUtODA5Ny00ODAyLWJhN2MtYWY3YWEwZmUyN2NlIiwiZXhwIjoxNzg4NDE4MjI2LCJpZGVudGl0eSI6ImthbyIsImZyZXNoIjpmYWxzZSwidHlwZSI6ImFjY2VzcyJ9.Qd_KdhjS760FQFNCIy7DOSOpdsSkzcQFpIf_AMUsbEE&guid=f666bae2-76d3-4acb-9d4b-45bd4b7c259b" },
  { name:"鳳仁路與澄觀路口", url:"https://floodinfo.kcg.gov.tw/public/SensorImage/3972500FL0007.jpg?guid=567bb3da-5052-477a-9b9d-7eb988321247" },
  { name:"八德東路23巷路口", url:"https://iapi.wra.gov.tw/v3/api/Image/4777c38d-a1c2-43a7-bc51-601d89fad4d5?guid=00639204-8d71-4b31-81ad-409151da3692" },

  /* --- 以下為免憑證版本（twipcam 轉送，不會過期） --- */
  { name:"仁雄橋", url:"https://c01.twipcam.com/cam/snapshot/wra-002896.jpg" },
  { name:"鳳仁路與澄觀路口（免憑證）", url:"https://c01.twipcam.com/cam/snapshot/khh-000272.jpg" },
  { name:"澄觀路、水管路三段東側", url:"https://c01.twipcam.com/cam/snapshot/khh-700013.jpg" },
  { name:"澄觀路、水管路三段西側", url:"https://c01.twipcam.com/cam/snapshot/khh-700014.jpg" },
  { name:"八德南路、停車場出入口", url:"https://c01.twipcam.com/cam/snapshot/khh-000454.jpg" },
  { name:"文前路、仁勇路（澄清巷）", url:"https://c01.twipcam.com/cam/snapshot/khh-000455.jpg" },
  { name:"仁雄路、鼎力路（路橋北側）", url:"https://c01.twipcam.com/cam/snapshot/khh-000209.jpg" },
  { name:"高速公路（興西路）、鳳仁路東北角", url:"https://c01.twipcam.com/cam/snapshot/khh-000207.jpg" },
  { name:"鳳仁路與水管路交岔路口", url:"https://c01.twipcam.com/cam/snapshot/khh-000273.jpg" },
  { name:"水管三路、義大二路東南角", url:"https://c01.twipcam.com/cam/snapshot/khh-000201.jpg" }
];

/* ====== 小工具 ====== */
const pad = n => String(n).padStart(2,"0");
const hhmmss = d => pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
const $ = id => document.getElementById(id);

function kindOf(url){
  if (/cctv\/wrs\/image/.test(url)) return "CCTV";
  if (/twipcam/.test(url)) return "道路";
  if (/wra\.gov\.tw/.test(url)) return "水利署";
  if (/SensorImage/.test(url)) return "感測";
  return "影像";
}
function keyOf(url){
  try {
    const u = new URL(url);
    return u.host + u.pathname.replace(/\/+/g,"/").replace(/\.jpg$/i,"");
  } catch(e){ return url.split("?")[0]; }
}
function jwtExpiry(url){
  const m = url.match(/[?&]jwt=([^&]+)/);
  if (!m) return null;
  try {
    const p = JSON.parse(atob(m[1].split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
    return p.exp ? new Date(p.exp*1000) : null;
  } catch(e){ return null; }
}

/* ====== 儲存 ====== */
const store = {
  get(k,fb){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch(e){ return fb; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let custom = store.get("flood.custom", []);
let overrides = store.get("flood.overrides", {});
let selected = store.get("flood.selected.v2b", null);

function catalog(){
  return BUILTIN.concat(custom).map(s => {
    const k = keyOf(s.url);
    return overrides[k] ? { ...s, url: overrides[k] } : s;
  });
}
if (!Array.isArray(selected)) selected = catalog().map(s => keyOf(s.url));
function isOn(s){ return selected.includes(keyOf(s.url)); }

/* ====== 站點選單 ====== */
const optsBox = $("opts");

function renderOpts(){
  const list = catalog();
  optsBox.innerHTML = "";
  list.forEach((s, i) => {
    const kind = kindOf(s.url);
    const row = document.createElement("label");
    row.className = "opt";
    row.innerHTML = `
      <input type="checkbox" ${isOn(s) ? "checked" : ""}>
      <span class="nm">${s.name}</span>
      <span class="kind ${kind === "CCTV" ? "jwt" : ""}">${kind}</span>`;
    row.querySelector("input").addEventListener("change", e => {
      const k = keyOf(s.url);
      selected = e.target.checked ? selected.concat(k) : selected.filter(x => x !== k);
      commit();
    });
    if (i >= BUILTIN.length) {
      const del = document.createElement("button");
      del.className = "del"; del.type = "button"; del.title = "刪除這個自訂站點"; del.textContent = "✕";
      del.addEventListener("click", ev => {
        ev.preventDefault(); ev.stopPropagation();
        custom = custom.filter(c => keyOf(c.url) !== keyOf(s.url));
        selected = selected.filter(x => x !== keyOf(s.url));
        store.set("flood.custom", custom);
        commit();
      });
      row.appendChild(del);
    }
    optsBox.appendChild(row);
  });
  const total = list.length, on = list.filter(isOn).length;
  $("picker-n").textContent = on + "/" + total;
  $("picker-count").textContent = "已選 " + on + " / 共 " + total;
}

document.querySelectorAll(".picker-acts .ctl").forEach(b => {
  b.addEventListener("click", () => {
    const act = b.dataset.act;
    if (act === "all") selected = catalog().map(s => keyOf(s.url));
    if (act === "none") selected = [];
    if (act === "notoken") selected = catalog().filter(s => kindOf(s.url) !== "CCTV").map(s => keyOf(s.url));
    commit();
  });
});

$("import-btn").addEventListener("click", () => {
  const lines = $("import-box").value.split("\n").map(l => l.trim()).filter(Boolean);
  const added = [];
  let updated = 0, pending = null;
  lines.forEach(l => {
    if (/^https?:\/\//i.test(l)) {
      const k = keyOf(l);
      const exists = catalog().some(s => keyOf(s.url) === k) || added.some(s => keyOf(s.url) === k);
      if (exists) {
        overrides[k] = l;           // 同一支攝影機 → 換掉網址，名稱與位置不動
        updated++;
      } else {
        added.push({ name: pending || ("站點 " + (catalog().length + added.length + 1)), url: l });
      }
      pending = null;
    } else pending = l;
  });
  if (added.length || updated) {
    if (added.length) {
      custom = custom.concat(added);
      selected = selected.concat(added.map(s => keyOf(s.url)));
      store.set("flood.custom", custom);
    }
    if (updated) store.set("flood.overrides", overrides);
    $("import-box").value = "";
    $("import-msg").textContent =
      (updated ? "已更新 " + updated + " 支憑證" : "") +
      (updated && added.length ? "、" : "") +
      (added.length ? "新增 " + added.length + " 個站點" : "");
    commit();
  } else {
    $("import-msg").textContent = "沒有可處理的網址";
  }
  setTimeout(() => { $("import-msg").textContent = ""; }, 5000);
});

/* ====== 影像牆 ====== */
const grid = $("grid");
let cards = [];

function renderGrid(){
  grid.innerHTML = "";
  cards = [];
  const list = selected.map(k => catalog().find(s => keyOf(s.url) === k)).filter(Boolean);
  $("empty").hidden = list.length > 0;

  list.forEach((s, i) => {
    const kind = kindOf(s.url);
    const el = document.createElement("article");
    el.className = "panel";
    el.draggable = true;
    el.dataset.k = keyOf(s.url);
    el.innerHTML = `
      <div class="rule" aria-hidden="true"><span class="idx">${pad(i+1)}</span><span class="unit">STATION</span></div>
      <div class="pbody">
        <div class="phead">
          <span class="grip" title="拖曳調整位置">⠿</span>
          <h2>${s.name}</h2>
          <span class="tag">${kind}</span>
          <span class="move">
            <button type="button" data-mv="-1" title="往前移" aria-label="往前移">‹</button>
            <button type="button" data-mv="1" title="往後移" aria-label="往後移">›</button>
          </span>
        </div>
        <div class="frame loading" tabindex="0" role="button" aria-label="放大 ${s.name}">
          <img alt="${s.name} 即時影像" draggable="false" hidden>
          <div class="state"><strong>畫面載入失敗</strong>憑證可能已到期，或平台暫時無回應。</div>
        </div>
        <div class="pfoot"><span class="dot"></span><span class="time">等待首張畫面</span><span class="exp"></span></div>
      </div>`;
    grid.appendChild(el);

    el.querySelectorAll(".move button").forEach(b => {
      b.addEventListener("click", ev => {
        ev.stopPropagation();
        moveBy(keyOf(s.url), Number(b.dataset.mv));
      });
    });

    const frame = el.querySelector(".frame");
    const img = el.querySelector("img");
    const time = el.querySelector(".time");
    const exp = el.querySelector(".exp");

    const expiry = jwtExpiry(s.url);
    if (expiry) {
      exp.textContent = "憑證 " + pad(expiry.getMonth()+1) + "/" + pad(expiry.getDate()) + " " + hhmmss(expiry).slice(0,5);
      if (expiry.getTime() - Date.now() < 6*3600*1000) exp.classList.add("soon");
    } else exp.textContent = "免憑證";

    cards.push({
      load(){
        frame.classList.add("loading");
        const probe = new Image();
        probe.onload = () => {
          img.src = probe.src; img.hidden = false;
          frame.classList.remove("loading","failed");
          el.classList.remove("failed"); el.classList.add("live");
          time.textContent = "更新於 " + hhmmss(new Date());
        };
        probe.onerror = () => {
          frame.classList.remove("loading"); frame.classList.add("failed");
          el.classList.remove("live"); el.classList.add("failed");
          time.textContent = "失敗於 " + hhmmss(new Date());
        };
        probe.src = s.url + (s.url.includes("?") ? "&" : "?") + "_=" + Date.now();
      }
    });

    const open = () => {
      if (!img.src || img.hidden) return;
      $("viewer-img").src = img.src;
      $("viewer-name").textContent = s.name;
      $("viewer").classList.add("open");
    };
    frame.addEventListener("click", open);
    frame.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
}

/* ====== 排序（拖曳／按鈕，順序存在本機） ====== */
function moveBy(key, delta){
  const i = selected.indexOf(key);
  const j = i + delta;
  if (i < 0 || j < 0 || j >= selected.length) return;
  selected.splice(j, 0, selected.splice(i, 1)[0]);
  commitOrder();
}
function moveTo(fromKey, toKey){
  if (fromKey === toKey) return;
  const i = selected.indexOf(fromKey), j = selected.indexOf(toKey);
  if (i < 0 || j < 0) return;
  selected.splice(j, 0, selected.splice(i, 1)[0]);
  commitOrder();
}
/* 只重排、不重新抓圖，避免拖曳時畫面閃爍 */
function commitOrder(){
  store.set("flood.selected.v2b", selected);
  const nodes = new Map([...grid.children].map(el => [el.dataset.k, el]));
  selected.forEach((k, n) => {
    const el = nodes.get(k);
    if (!el) return;
    grid.appendChild(el);
    const idx = el.querySelector(".idx");
    if (idx) idx.textContent = pad(n + 1);
  });
}

let dragKey = null;
grid.addEventListener("dragstart", e => {
  const p = e.target.closest(".panel");
  if (!p) return;
  dragKey = p.dataset.k;
  p.classList.add("dragging");
  e.dataTransfer.effectAllowed = "move";
  try { e.dataTransfer.setData("text/plain", dragKey); } catch(err){}
});
grid.addEventListener("dragend", e => {
  const p = e.target.closest(".panel");
  if (p) p.classList.remove("dragging");
  [...grid.children].forEach(el => el.classList.remove("over"));
  dragKey = null;
});
grid.addEventListener("dragover", e => {
  const p = e.target.closest(".panel");
  if (!p || !dragKey) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = "move";
  [...grid.children].forEach(el => el.classList.toggle("over", el === p && el.dataset.k !== dragKey));
});
grid.addEventListener("drop", e => {
  const p = e.target.closest(".panel");
  if (!p || !dragKey) return;
  e.preventDefault();
  moveTo(dragKey, p.dataset.k);
  [...grid.children].forEach(el => el.classList.remove("over"));
});

function refreshAll(){ elapsed = 0; cards.forEach(c => c.load()); }
function commit(){ store.set("flood.selected.v2b", selected); renderOpts(); renderGrid(); refreshAll(); }

/* ====== 排程 ====== */
let paused = false, elapsed = 0;
setInterval(() => {
  $("clock").textContent = hhmmss(new Date());
  if (paused) { $("progress").style.width = "0%"; return; }
  const period = Number($("interval").value);
  elapsed++;
  $("progress").style.width = Math.min(100,(elapsed/period)*100) + "%";
  if (elapsed >= period) refreshAll();
}, 1000);

$("pause").addEventListener("click", () => {
  paused = !paused;
  $("pause").dataset.paused = String(paused);
  $("pause").textContent = paused ? "恢復更新" : "暫停更新";
});
$("reload").addEventListener("click", refreshAll);
$("interval").addEventListener("change", () => { elapsed = 0; });

/* ====== 放大檢視 ====== */
$("viewer-close").addEventListener("click", () => $("viewer").classList.remove("open"));
$("viewer").addEventListener("click", e => { if (e.target === $("viewer") || e.target === $("viewer-img")) $("viewer").classList.remove("open"); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  $("viewer").classList.remove("open");
  $("picker").classList.remove("open");
});

/* ====== 頁首收合 ====== */
const bar = document.querySelector(".bar");
const hotzone = $("hotzone");
const picker = $("picker");
let hideTimer;

function measureBar(){ document.documentElement.style.setProperty("--barh", bar.offsetHeight + 6 + "px"); }
function showBar(){ clearTimeout(hideTimer); measureBar(); bar.classList.remove("collapsed"); document.body.classList.add("bar-open"); }
function collapse(){ bar.classList.add("collapsed"); document.body.classList.remove("bar-open"); picker.classList.remove("open"); }
function hideBar(delay){
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (picker.classList.contains("open") || bar.contains(document.activeElement)) { hideBar(1500); return; }
    collapse();
  }, delay);
}
measureBar();
document.body.classList.add("bar-open");
window.addEventListener("resize", () => { if (!bar.classList.contains("collapsed")) measureBar(); });

hotzone.addEventListener("mouseenter", showBar);
bar.addEventListener("mouseenter", showBar);
bar.addEventListener("focusin", showBar);
bar.addEventListener("change", showBar);
bar.addEventListener("mouseleave", () => hideBar(500));
hotzone.addEventListener("mouseleave", () => hideBar(500));
bar.addEventListener("focusout", () => hideBar(1200));
hotzone.addEventListener("click", () => { bar.classList.contains("collapsed") ? showBar() : collapse(); });

$("picker-btn").addEventListener("click", e => {
  e.stopPropagation();
  picker.classList.toggle("open");
  showBar();
});
document.addEventListener("click", e => {
  if (!picker.contains(e.target) && e.target !== $("picker-btn")) picker.classList.remove("open");
});

/* ====== 啟動 ====== */
commit();
hideBar(2500);
</script>
